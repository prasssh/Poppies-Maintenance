          - heading "1. Introduction" [level=2] [ref=f3e44]
          - paragraph [ref=f3e45]:
            - text: Our website,
            - link "https://poppies.us" [ref=f3e46] [cursor=pointer]:
              - /url: https://poppies.us
            - text: "(hereinafter: \"the website\") uses cookies and other related technologies (for convenience all technologies are referred to as \"cookies\"). Cookies are also placed by third parties we have engaged. In the document below we inform you about the use of cookies on our website."
          - heading "2. Cookies" [level=2] [ref=f3e47]
          - paragraph [ref=f3e48]: When you visit our website it can be necessary to store and/or read certain data from your device by using technologies such as cookies.
          - heading "2.1 Technical or functional cookies" [level=3] [ref=f3e49]
          - paragraph [ref=f3e50]: Some cookies ensure that certain parts of the website work properly and that your user preferences remain known. By placing functional cookies, we make it easier for you to visit our website. This way, you do not need to repeatedly enter the same information when visiting our website and, for example, the items remain in your shopping cart until you have paid. We may place these cookies without your consent.
          - heading "2.2 Statistics cookies" [level=3] [ref=f3e51]
          - paragraph [ref=f3e52]: We use statistics cookies to optimize the website experience for our users. With these statistics cookies we get insights in the usage of our website.
          - heading "2.3 Marketing/Tracking cookies" [level=3] [ref=f3e53]
          - paragraph [ref=f3e54]: Marketing/Tracking cookies are cookies or any other form of local storage, used to create user profiles to display advertising or to track the user on this website or across several websites for similar marketing purposes.
          - heading "2.4 Social media" [level=3] [ref=f3e55]
          - paragraph [ref=f3e56]: On our website, we have included content from Instagram to promote web pages (e.g. “like”, “pin”) or share (e.g. “tweet”) on social networks like Instagram. This content is embedded with code derived from Instagram and places cookies. This content might store and process certain information for personalized advertising.
          - paragraph [ref=f3e57]: Please read the privacy statement of these social networks (which can change regularly) to read what they do with your (personal) data which they process using these cookies. The data that is retrieved is anonymized as much as possible. Instagram is located in the United States.
          - heading "3. Placed cookies" [level=2] [ref=f3e58]
          - paragraph
          - paragraph [ref=f3e59]: Most of these technologies have a function, a purpose, and an expiration period.
          - list [ref=f3e60]:
            - listitem [ref=f3e61]: A function is a particular task a technology has. So a function can be to "store certain data."
            - listitem [ref=f3e62]: Purpose is "the Why" behind the function. Maybe the data is stored because it is needed for statistics.
            - listitem [ref=f3e63]: The expiration period shows the length of the period the used technology can “store or read certain data."
